name: Build BTTB Companion

on:
  workflow_dispatch:
  push:
    tags:
      - "companion-v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 11 Big Sur Intel
            os: macos-15-intel
            artifact: bttb-companion-macos11-intel

    runs-on: ${{ matrix.os }}

    env:
      DATABASE_URL: postgresql://bttb:bttb@127.0.0.1:5432/bttb_companion_build
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - name: Check out BTTB
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Check Companion pairing tests
        run: npm run test:companion-pairing && npm run test:companion-session

      - name: Build portable Companion
        run: npm run companion:package

      - name: Verify macOS 11 Intel compatibility
        if: runner.os == 'macOS'
        run: |
          set -eu
          APP=".bttb-companion/package-darwin-x64/BTTB Companion.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")" = "11.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "1.0.1"
          file "$APP/Contents/MacOS/BTTB Companion" | grep -q 'x86_64'
          otool -l "$APP/Contents/MacOS/BTTB Companion" | grep -A4 LC_BUILD_VERSION | grep -q 'minos 11.0'
          codesign --verify --deep --strict "$APP"

      - name: Upload Companion build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .bttb-companion/releases/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged Companion release
    if: startsWith(github.ref, 'refs/tags/companion-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all Companion builds
        uses: actions/download-artifact@v4
        with:
          path: companion-release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" companion-release/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BTTB Companion 1.0.1 Performance Beta for macOS 11 Big Sur (Intel)" \
            --notes "Performance beta update for macOS Big Sur 11.7.11 Intel. Reuses one Serato library scan and track index across crates; reports scan warnings in the Companion window. Preserve v1.0 as a separate download. Not Apple-notarized and not yet tested on the destination Big Sur Mac. Electron 37.10.3 is older and no longer receives security updates."
